[alembic]
# Store revision scripts separately from application runtime code.
script_location = migrations
prepend_sys_path = .
# Runtime environment configuration overrides this development default.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/ai_customer_service

# Configure Alembic and SQLAlchemy logging to use the console handler.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
# Send migration logs to standard error using the shared formatter.
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S