# PostgreSQL provides durable storage for conversations, messages, and reference data.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_customer_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Keep the API from starting until PostgreSQL accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_customer_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API applies migrations at startup and serves the OpenAPI-documented endpoints.
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/ai_customer_service
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Preserve database contents when containers are recreated.
  postgres_data: